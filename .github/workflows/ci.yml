name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scion

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run API tests
        run: make test-api

      - name: Run ingestion tests
        run: make test-ingestion

      - name: Run web typecheck
        run: make web-typecheck

      - name: Run web build
        run: make web-build

      - name: Run Cloudflare Worker build and deploy dry run
        working-directory: apps/web
        run: |
          npm run build:vinext
          npx wrangler deploy --dry-run --config dist/server/wrangler.json

      - name: Build packaged volume engine sidecar
        working-directory: apps/desktop
        run: npm run sidecar:build

      - name: Run desktop checks
        run: make desktop-typecheck desktop-test-caos desktop-build desktop-tauri-check

      - name: Run volume engine checks
        run: make volume-engine-check volume-engine-test

      - name: Run stack smoke test
        run: make smoke-web
